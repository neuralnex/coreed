version: '3.8'

services:
  agent-space:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount your model files
      - ./models:/app/models:ro
      # Mount your custom code (optional)
      - ./main.py:/app/main.py:ro
    environment:
      - MODEL_PATH=/app/models/model.gguf
      - MODEL_NAME=My Coreed Agent
      - SPACE_ID=1
      - SPACE_VERSION=1.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-space
    profiles:
      - production
    restart: unless-stopped
