[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coreed-cli-v3"
version = "3.0.0"
description = "Push to Coreed - Deploy AI models and agents to Coreed on 0G Chain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Coreed Team", email = "team@coreed.ai"}
]
keywords = ["ai", "0g", "blockchain", "coreed", "deployment", "model-registry", "space-registry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "web3>=6.0.0",
    "requests>=2.28.0",
    "toml>=0.10.2",
    "python-dotenv>=0.21.0",
]

[project.scripts]
push-to-coreed = "cli.coreed_cli:main"

[project.urls]
Homepage = "https://coreed.ai"
Documentation = "https://github.com/coreed/coreed/docs"
Repository = "https://github.com/coreed/coreed"
Issues = "https://github.com/coreed/coreed/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.wheel]
package-dir = "."

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]